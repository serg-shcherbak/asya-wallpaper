name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pipeline test dependencies
        run: python -m pip install -r pipeline/requirements.txt

      - name: Reject tracked secrets
        shell: bash
        run: |
          if git grep -nE 'vcp_[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9_-]{20,}' -- .; then
            echo "A tracked file contains a credential-like token"
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must never be tracked"
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Frontend tests
        run: pnpm test

      - name: Mock-only pipeline tests
        run: python -m pytest pipeline -q

      - name: Static build
        run: pnpm build

      - name: Check deployment artifact boundaries
        shell: bash
        run: |
          test -d out/data
          test -d out/samples
          test -d out/share
          test ! -e out/pipeline
          test ! -e "out/Обои"
